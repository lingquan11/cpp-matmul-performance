name: compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Compile results/src and check blocking correctness
        run: bash results/tests/smoke.sh
      - name: Read-only median check from archived CSV
        run: python3 results/scripts/summarize-medians.py | head -n 30
